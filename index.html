<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的投資組合監控</title>
    <!-- 引入 Tailwind CSS 進行設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Alpine.js 處理邏輯 -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">

    <div x-data="stockApp()" x-init="init()" class="max-w-md mx-auto p-4 min-h-screen">
        <!-- 標題區域 -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-white">資產儀表板</h1>
                <p class="text-xs text-slate-500">自動監控與財經快訊</p>
            </div>
            <button @click="syncPrices()" :class="loading ? 'animate-spin' : ''" class="bg-slate-800 p-3 rounded-full hover:bg-slate-700 transition">
                🔄
            </button>
        </header>

        <!-- 持股列表 -->
        <div class="space-y-4">
            <template x-for="stock in myPortfolio" :key="stock.code">
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-xl">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="font-bold text-lg text-white" x-text="stock.name"></h2>
                            <a :href="'https://www.google.com/search?q=' + stock.name + '+新聞'" target="_blank" 
                               class="text-[10px] uppercase tracking-widest text-emerald-500 hover:underline mt-1 block">查看新聞 →</a>
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-mono font-bold" x-text="stock.price ? stock.price : '載入中...'"></div>
                            <div :class="stock.change >= 0 ? 'text-red-500' : 'text-emerald-400'" 
                                 class="text-xs font-mono" 
                                 x-text="(stock.change >= 0 ? '+' : '') + stock.change"></div>
                        </div>
                    </div>
                    
                    <!-- 持倉資訊 -->
                    <div class="bg-slate-950 p-3 rounded-xl flex justify-between text-xs">
                        <span class="text-slate-500">損益計算:</span>
                        <span :class="(stock.price - stock.cost) * stock.shares >= 0 ? 'text-red-500' : 'text-emerald-400'" 
                              class="font-mono font-bold"
                              x-text="((stock.price - stock.cost) * stock.shares).toFixed(0)"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <script>
    function stockApp() {
        return {
            loading: false,
            // 【設定你的持股】: cost 是你的買進平均價, shares 是持有股數
            myPortfolio: [
                { code: '2330.TW', name: '台積電', cost: 900, shares: 1000 },
                { code: '2317.TW', name: '鴻海', cost: 180, shares: 2000 },
                { code: '2454.TW', name: '聯發科', cost: 1100, shares: 500 }
            ],
            async syncPrices() {
                this.loading = true;
                for (let stock of this.myPortfolio) {
                    try {
                        const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + stock.code)}`;
                        const res = await fetch(url);
                        const data = await res.json();
                        const meta = JSON.parse(data.contents).chart.result[0].meta;
                        stock.price = meta.regularMarketPrice.toFixed(2);
                        stock.change = (meta.regularMarketPrice - meta.previousClose).toFixed(2);
                    } catch (e) { console.error("更新失敗"); }
                }
                this.loading = false;
            },
            init() {
                this.syncPrices();
                setInterval(() => this.syncPrices(), 300000); // 每 5 分鐘自動刷新
            }
        }
    }
    </script>
</body>
</html>
